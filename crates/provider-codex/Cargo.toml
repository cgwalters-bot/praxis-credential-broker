[package]
name = "provider-codex"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
synthetic-test = []
default = ["codex-http-client", "codex-login"]

[dependencies]
async-trait.workspace = true
codex-http-client = { git = "https://github.com/openai/codex.git", rev = "0dfb28edb9305fcae4ab006fb6b7b196cbdbac28", optional = true }
codex-login = { git = "https://github.com/openai/codex.git", rev = "0dfb28edb9305fcae4ab006fb6b7b196cbdbac28", optional = true }
credential-protocol = { path = "../credential-protocol" }
fs2 = "0.4"
libc = "0.2"
serde_json.workspace = true
tokio.workspace = true
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
