# Which GitHub Actions jobs may register runs, and so use the broker's own
# credentials (the "injected" routes in praxis.yaml). The gateway reads it
# from /etc/praxis-credential-broker/run-token-policy.yaml; without that
# file no run can register, and only pass-through requests are served.
#
# This example matches no token: copy it, name the workflows and the
# repository or owner ids that may register runs, and mount the copy there
# (PRAXIS_RUN_TOKEN_POLICY for native-pod.sh, a drop-in for Quadlet).
#
# Exact job_workflow_ref claims that may register runs.
workflows:
  - "example-owner/example-repo/.github/workflows/agent.yml@refs/heads/main"
# Pin the repository (or owner) by id: names can be re-registered.
repository_ids: [0]
# Optional, with these defaults:
# owner_ids: []
# entry_workflows: only the job's own workflow
# events: [workflow_dispatch]
# audience: praxis-credential-broker
# jwks_url: https://token.actions.githubusercontent.com/.well-known/jwks
# How long a run lasts. Past 6h, also lengthen the window of the per-run caps
# (the `run` rules in praxis.yaml), or the cap starts sliding mid-run.
# max_secs: 21600
# Requests of one run in flight at once.
# concurrency: 4
#
# The two entries below are OFF unless present, and each admits tokens that
# `workflows` above refuses. A token registers if any one entry admits it;
# its signature, issuer, audience and validity are checked first whatever
# the entries say. Read "Admitting more workflows" in INTERNALS.md before
# uncommenting either: both widen who can spend the broker's credentials.
#
# A workflow admitted wherever it runs, which is how a reusable workflow
# called from another repository registers. `workflow` and `ref` are the
# two halves of `job_workflow_ref`, `sha` is `job_workflow_sha` (give
# either or both), and `callers` says which repositories may run it: by
# owner id, by repository id, or `any: true` for every repository on
# GitHub. Nothing here pins the called repository by id: the token has no
# id for it. Each entry has its own `events`: the `events` and
# `entry_workflows` above narrow `workflows` only.
# called_workflows:
#   - workflow: example-owner/example-lib/.github/workflows/job.yml
#     ref: refs/heads/main
#     # sha: 0123456789abcdef0123456789abcdef01234567
#     callers:
#       owner_ids: [0]
#       # repository_ids: [0]
#       # any: true
#     # events: [workflow_dispatch]   # any event if left out
#
# Every workflow, at every ref, of the repositories it names: the workflow
# file, what called it and its event are not checked.
# any_workflow:
#   repositories:
#     owner_ids: [0]
#     # repository_ids: [0]
#     # any: true
#   # events: [workflow_dispatch]   # any event if left out
#
# OFF unless present: also register runs that prove nothing. With it, a
# POST /v1/runs with no Authorization and an `x-run-id` header registers a
# run under that name, for ANY client that can reach the listener: the
# network is then the only gate on the broker's credentials, and the gateway
# cannot tell a job from its own agent or from any other peer. Read
# "Registering a run without proof" in INTERNALS.md before uncommenting it.
# With `unproven` and no `workflows` or ids at all, runs register only so.
# unproven:
#   # Required. Registrations without proof admitted in any window, from all
#   # callers together: each one is a fresh per-run cap, so this bounds how
#   # many of them an agent that registers runs of its own can mint. At
#   # most 34 an hour with the default max_secs, since a run is remembered
#   # for a day after it expires and 1024 such runs are.
#   max_registrations: 8
#   # The window, in seconds.
#   # window_secs: 3600
