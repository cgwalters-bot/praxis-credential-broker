# praxis.yaml plus Anthropic Messages, on the same listener, routed by path:
#
#   /v1/responses, /healthz          Codex Responses via credential-proxy, as in praxis.yaml
#   /anthropic/v1/messages           Messages with the broker's Claude token
#   /anthropic/v1/messages/count_tokens   (clients hold only a placeholder)
#   /v1/messages                     Messages with the client's own Claude OAuth
#
# The gateway image runs this file instead of praxis.yaml when
# PRAXIS_ANTHROPIC_GATEWAY=enabled; praxis-gateway-entrypoint then exports the
# token from its Podman secret. See INTERNALS.md before changing anything here.
#
# For /anthropic, clients send exactly
# `Authorization: Bearer praxis-substitute:anthropic` (Claude Code:
# ANTHROPIC_BASE_URL=http://host:18080/anthropic and
# ANTHROPIC_AUTH_TOKEN=praxis-substitute:anthropic). The placeholder is not
# authentication: anyone who can reach this listener can spend the
# subscription.
#
# THE FILTER ORDER AND THE CONDITIONS ARE SECURITY-CRITICAL. Conditions and
# the router see the request as it is when each filter runs, and all of them
# match the raw request path: Praxis does not normalize it. Every check of the
# client's Authorization has to run before a headers filter removes it, and a
# filter that acts on one route has to be conditioned on that same raw path.
listeners:
  - name: ai-gateway
    address: "0.0.0.0:8081"
    filter_chains: [gateway]
filter_chains:
  - name: gateway
    filters:
      # 1. Default deny for /anthropic: unless this is a POST whose
      #    Authorization is exactly the placeholder (case-sensitive, first
      #    header if duplicated), answer 403 and never forward. Other methods
      #    could have an upstream echo the token (TRACE).
      - filter: static_response
        conditions:
          - when:
              path_prefix: "/anthropic"
          - unless:
              methods: [POST]
              headers:
                authorization: "Bearer praxis-substitute:anthropic"
        status: 403
        headers:
          - name: content-type
            value: application/json
        body: '{"type":"error","error":{"type":"permission_error","message":"missing or unknown praxis placeholder credential"}}'
      # 2. The placeholder means nothing anywhere else, so refuse it there
      #    rather than forward it to credential-proxy or as a client OAuth
      #    token. This also catches spellings of the prefix that skip step 1,
      #    such as "//anthropic/..." or "/anthropic%2f...".
      - filter: static_response
        conditions:
          - when:
              headers:
                authorization: "Bearer praxis-substitute:anthropic"
          - unless:
              path_prefix: "/anthropic"
        status: 403
        headers:
          - name: content-type
            value: application/json
        body: '{"type":"error","error":{"type":"permission_error","message":"praxis placeholder credential outside /anthropic"}}'
      # Unchanged from praxis.yaml, except that it does not see Messages.
      - filter: openai_responses_proxy
        name: inference
        conditions:
          - unless:
              path_prefix: "/anthropic"
          - unless:
              path: "/v1/messages"
      # Messages validation for the client-OAuth route, which has no
      # placeholder check in front of it. Keep classifier headers internal.
      - filter: anthropic_messages_format
        conditions:
          - when:
              path: "/v1/messages"
        on_invalid: reject
        headers:
          format: null
          model: null
          stream: null
      - filter: anthropic_validate
        conditions:
          - when:
              path: "/v1/messages"
      - filter: anthropic_messages_protocol
        conditions:
          - when:
              path: "/v1/messages"
      # 3. The only routes. The upstream is fixed by the route, not by the
      #    client, and the /anthropic routes also match the placeholder, so
      #    the broker's credential is bound to them. Every Anthropic route is
      #    an exact path: Praxis forwards paths without normalizing them and
      #    api.anthropic.com resolves "..", so with a prefix such as
      #    "/anthropic/v1/" a request for "/anthropic/v1/../api/oauth/..."
      #    would spend the token on account endpoints. The router matches the
      #    raw path, before the rewrite in step 4.
      - filter: router
        routes:
          - path_prefix: "/healthz"
            cluster: inference-backend
          - path_prefix: "/v1/responses"
            cluster: inference-backend
          - path: "/anthropic/v1/messages"
            headers:
              authorization: "Bearer praxis-substitute:anthropic"
            cluster: anthropic
          - path: "/anthropic/v1/messages/count_tokens"
            headers:
              authorization: "Bearer praxis-substitute:anthropic"
            cluster: anthropic
          - path: "/v1/messages"
            cluster: anthropic-client-oauth
      # 4. Upstream, /anthropic/v1/... is /v1/.... Only the two exact routes
      #    above reach this with the prefix, so nothing is left to normalize.
      - filter: path_rewrite
        conditions:
          - when:
              path_prefix: "/anthropic"
        strip_prefix: "/anthropic"
      # 5. /anthropic: strip every copy of the client's credentials, fix the
      #    authority, and append the OAuth beta to any anthropic-beta the
      #    client sent (request_add appends rather than replaces). The
      #    condition is the same raw prefix as step 1, so it covers both
      #    routes to the anthropic cluster.
      - filter: headers
        conditions:
          - when:
              path_prefix: "/anthropic"
        request_remove:
          - authorization
          - x-api-key
        request_set:
          - name: Host
            value: api.anthropic.com
        request_add:
          - name: anthropic-beta
            value: oauth-2025-04-20
      # 6. /v1/messages: Claude Code's own OAuth bearer token and Anthropic
      #    protocol headers pass through unchanged. Remove API-key
      #    authentication so the two credential forms cannot be sent
      #    together, and force the upstream authority.
      - filter: headers
        conditions:
          - when:
              path: "/v1/messages"
        request_remove: ["x-api-key"]
        request_set:
          - name: Host
            value: api.anthropic.com
      # 7. The real token, from a Podman secret exposed only to Praxis's
      #    environment. It is keyed on the cluster the router chose, so only
      #    the anthropic cluster gets it: anthropic-client-oauth is a separate
      #    cluster for exactly this reason, and inference-backend gets the
      #    Codex credential from credential-proxy instead.
      - filter: credential_injection
        clusters:
          - name: anthropic
            header: Authorization
            header_prefix: "Bearer "
            env_var: PRAXIS_ANTHROPIC_OAUTH_TOKEN
      - filter: load_balancer
        clusters:
          - name: inference-backend
            endpoints: ["127.0.0.1:8080"]
          - name: anthropic
            endpoints: ["api.anthropic.com:443"]
            tls:
              sni: "api.anthropic.com"
          - name: anthropic-client-oauth
            endpoints: ["api.anthropic.com:443"]
            tls:
              sni: "api.anthropic.com"
# The Responses filter makes Praxis read each request body in full before any
# request filter runs, including the deny filters above, and Praxis caps what
# it reads at 10 MiB by default. Raise that to the Messages API's own 32 MB
# request limit so large Claude Code requests (images, PDFs) still fit.
body_limits:
  max_request_bytes: 33554432
insecure_options:
  allow_private_endpoints: true
