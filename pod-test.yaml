apiVersion: v1
kind: Pod
metadata: {name: praxis-credential-broker-test}
spec:
  securityContext: {runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532}
  containers:
    - name: proxy
      image: localhost/praxis-credential-proxy:test
      securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumeMounts: [{name: agent-socket, mountPath: /run/praxis-credentials}, {name: client-auth, mountPath: /run/secrets/client, readOnly: true}, {name: agent-channel, mountPath: /run/secrets/channel, readOnly: true}, {name: tmp, mountPath: /tmp}]
    - name: synthetic-agent
      image: localhost/praxis-provider-codex:synthetic
      ports: [{containerPort: 19090, hostPort: 19090, hostIP: 127.0.0.1}]
      securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumeMounts: [{name: agent-socket, mountPath: /run/praxis-credentials}, {name: agent-channel, mountPath: /run/secrets/channel, readOnly: true}]
    - name: praxis
      image: ghcr.io/praxis-proxy/ai@sha256:ccd46f8772eebcbde2f41ad35c3234d23463b8314a5865083e32baf31eddd1a8
      args: ["--config", "/etc/praxis/praxis.yaml"]
      ports: [{containerPort: 8081, hostPort: 18081, hostIP: 127.0.0.1}]
      securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumeMounts: [{name: config, mountPath: /etc/praxis, readOnly: true}]
    - name: mock-upstream
      image: localhost/praxis-mock-upstream:dev
      ports: [{containerPort: 18081, hostPort: 18082, hostIP: 127.0.0.1}]
      securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
  volumes:
    - {name: agent-socket, emptyDir: {}}
    - {name: client-auth, secret: {secretName: praxis-credential-broker-test-client}}
    - {name: agent-channel, secret: {secretName: praxis-credential-broker-test-channel}}
    - {name: config, configMap: {name: praxis-credential-broker-test-config}}
    - {name: tmp, emptyDir: {medium: Memory}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: praxis-credential-broker-test-config}
data:
  praxis.yaml: |
    listeners:
      - {name: test, address: "0.0.0.0:8081", filter_chains: [test-chain]}
    filter_chains:
      - name: test-chain
        filters:
          - {filter: router, routes: [{path_prefix: "/", cluster: proxy-backend}]}
          - {filter: load_balancer, clusters: [{name: proxy-backend, endpoints: ["127.0.0.1:8080"]}]}
    insecure_options: {allow_private_endpoints: true}
---
apiVersion: v1
kind: Secret
metadata: {name: praxis-credential-broker-test-client}
type: Opaque
stringData: {client-api-key: synthetic-client-key-012345678901234567890123}
---
apiVersion: v1
kind: Secret
metadata: {name: praxis-credential-broker-test-channel}
type: Opaque
stringData: {agent-channel-key: synthetic-agent-channel-012345678901234567890123}
